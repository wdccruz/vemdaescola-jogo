# Publica o jogo no GitHub Pages (https://<usuário>.github.io/<repositório>/).
# Habilite em Settings → Pages → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar os arquivos do jogo
        run: |
          mkdir -p site/jogos
          cp -r index.html css js fonts site/
          cp -r jogos/trem-das-historias site/jogos/
          cp -r jogos/nina-mundo-desaparecendo site/jogos/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
