<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O Mistério da Biblioteca Encantada</title>
  <meta name="description" content="Jogo educativo para crianças de 6 a 10 anos: ajude os livros vivos Lilo e Lila a recuperar as palavras mágicas da biblioteca.">
  <meta name="theme-color" content="#7c4a25">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='12' y='8' width='40' height='50' rx='7' fill='%231fbfb8' stroke='%2323233f' stroke-width='4'/%3E%3Ccircle cx='26' cy='28' r='6' fill='%23fff'/%3E%3Ccircle cx='40' cy='28' r='6' fill='%23fff'/%3E%3Ccircle cx='27' cy='29' r='2.5' fill='%2323233f'/%3E%3Ccircle cx='41' cy='29' r='2.5' fill='%2323233f'/%3E%3Cpath d='M25 40q8 8 16 0z' fill='%233a1830'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/baloo2.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/chars.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="game">
  <div id="stage">
    <div id="world"><div id="back" class="layer"></div><div id="mid" class="layer"></div><div id="things"></div><div id="fore" class="layer"></div></div>
    <div id="hud">
      <ol id="phases" aria-label="Fases"><li><span>1</span></li><li><span>2</span></li><li><span>3</span></li></ol>
      <div class="hud-btns">
        <button type="button" class="round sound" data-sound aria-pressed="false" aria-label="Ligar o som"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="waves" d="M16 9q2 3 0 6M18.5 6.500q4.5 5.5 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <button type="button" class="round" id="b-home" aria-label="Voltar ao início"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z" fill="currentColor"/></svg></button>
      </div>
    </div>
  </div>

  <div id="tray">
    <div class="pad pad-l">
      <button type="button" class="ctl" id="b-left" aria-label="Andar para a esquerda"><svg viewBox="0 0 24 24"><path d="M15 4L7 12l8 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="ctl" id="b-right" aria-label="Andar para a direita"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="ctx" aria-live="polite"></div>
    <div class="pad pad-r">
      <button type="button" class="ctl act" id="b-act" aria-label="Investigar"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
      <button type="button" class="ctl jump" id="b-jump" aria-label="Pular"><svg viewBox="0 0 24 24"><path d="M4 14l8-8 8 8M12 7v13" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <section id="start" class="screen" aria-labelledby="titulo">
    <button type="button" class="round sound corner" data-sound aria-pressed="false" aria-label="Ligar o som"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="waves" d="M16 9q2 3 0 6M18.5 6.500q4.5 5.5 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div class="bg" aria-hidden="true"></div>
    <div class="start-in">
      <h1 id="titulo" class="plaque"><small>O Mistério da</small> <span>Biblioteca</span> <span class="t2">Encantada</span></h1>
      <div class="duo" aria-hidden="true"></div>
      <button type="button" class="play" data-play><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Jogar</button>
      <ul class="how" aria-label="Como jogar">
        <li><svg viewBox="0 0 48 24"><path d="M12 5l-7 7 7 7M36 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>Ande</li>
        <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 4"/></svg>Toque</li>
        <li><svg viewBox="0 0 24 24"><path d="M4 14l8-8 8 8M12 7v13" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>Pule</li>
      </ul>
      <p class="record"></p>
    </div>
  </section>

  <section id="end" class="screen" hidden aria-labelledby="fim">
    <div class="bg" aria-hidden="true"></div>
    <div class="confetti" aria-hidden="true"></div>
    <div class="start-in">
      <h1 id="fim" class="plaque"><small>A biblioteca voltou a</small> <span>brilhar!</span></h1>
      <div class="duo" aria-hidden="true"></div>
      <div class="words" aria-label="Palavras mágicas recuperadas"></div>
      <div class="stars" aria-label="Estrelas"></div>
      <p class="best"></p>
      <button type="button" class="play" data-play><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Jogar de novo</button>
    </div>
  </section>

  <div id="curtain" aria-hidden="true"><div><small></small><b></b></div></div>
</div>
<script src="js/chars.js"></script>
<script src="js/audio.js"></script>
<script src="js/scenes.js"></script>
<script src="js/game.js"></script>
</body>
</html>
